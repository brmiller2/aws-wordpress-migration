<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs>
  <rect width="760" height="680" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">WordPress runs on one EC2 instance behind a locked-down security group</text>
  <text x="24" y="52" font-size="11.5" fill="#57606a">Rehost (lift-and-shift): the full LAMP stack on a single server</text>
  <rect x="232" y="72" width="504" height="584" rx="8" fill="none" stroke="#ff9900" stroke-width="1.5"/>
  <text x="248" y="94" font-weight="600" fill="#1f2328">AWS Cloud, us-east-1 (N. Virginia)</text>
  <rect x="248" y="112" width="472" height="528" rx="8" fill="none" stroke="#8c4fff" stroke-width="1.25"/>
  <text x="264" y="134" font-size="12" fill="#1f2328">Default VPC</text>
  <rect x="264" y="152" width="440" height="472" rx="8" fill="#f3faf3" stroke="#3f8624" stroke-width="1.25"/>
  <text x="280" y="174" font-size="12" fill="#1f2328">Public subnet</text>
  <rect x="280" y="192" width="408" height="416" rx="8" fill="none" stroke="#d13212" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="296" y="214" font-size="12" fill="#1f2328">Security group: SSH 22 from my IP only, HTTP 80 open</text>
  <rect x="296" y="240" width="376" height="352" rx="8" fill="#fff8ee" stroke="#ff9900" stroke-width="1.25"/>
  <text x="312" y="262" font-weight="600" fill="#1f2328">EC2 t3.micro, Ubuntu</text>
  <g fill="#ffffff" stroke="#8a8f98" stroke-width="1.25">
    <rect x="312" y="280" width="344" height="56" rx="8"/><rect x="312" y="360" width="344" height="56" rx="8"/>
    <rect x="312" y="440" width="344" height="56" rx="8" fill="#e8f1fb" stroke="#2f6fbf" stroke-width="2"/><rect x="312" y="520" width="344" height="56" rx="8"/>
  </g>
  <g fill="#1f2328" font-weight="600"><text x="328" y="304">Apache2</text><text x="328" y="384">PHP</text><text x="328" y="464">WordPress</text><text x="328" y="544">MySQL</text></g>
  <g fill="#57606a" font-size="11.5"><text x="328" y="322">Web server, answers HTTP requests</text><text x="328" y="402">Runs WordPress code via libapache2-mod-php</text><text x="328" y="482">Files in /var/www/html, settings in wp-config.php</text><text x="328" y="562">wordpress_db via wordpress_user on localhost</text></g>
  <g stroke="#8a8f98" stroke-width="1.25" fill="none"><path d="M484 336V360" marker-end="url(#a)"/><path d="M484 416V440" marker-end="url(#a)"/><path d="M484 496V520" marker-end="url(#a)"/><path d="M184 308H312" marker-end="url(#a)"/><path d="M184 484H296" marker-end="url(#a)"/></g>
  <g fill="#57606a" font-size="11.5"><text x="494" y="352">passes .php requests</text><text x="494" y="432">runs the app</text><text x="494" y="512">reads and writes content</text></g>
  <rect x="24" y="280" width="160" height="56" rx="8" fill="#f6f8fa" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="40" y="304" font-weight="600" fill="#1f2328">Site visitors</text><text x="40" y="322" font-size="11.5" fill="#57606a">Browser, HTTP port 80</text>
  <rect x="24" y="456" width="160" height="56" rx="8" fill="#f6f8fa" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="40" y="480" font-weight="600" fill="#1f2328">Admin (me)</text><text x="40" y="498" font-size="11.5" fill="#57606a">SSH port 22, .pem key</text>
</svg>
